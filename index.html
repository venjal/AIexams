<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Exams - Learner Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
    .card { background-color: #1e293b; border: 1px solid #334155; color: #f8fafc; border-radius: 12px; }
    .form-control { background-color: #0f172a; border-color: #334155; color: #fff; }
    .form-control:focus { background-color: #0f172a; border-color: #38bdf8; color: #fff; box-shadow: none; }
    .btn-primary { background-color: #2563eb; border: none; font-weight: 600; }
    .btn-primary:hover { background-color: #1d4ed8; }
    .instructor-link { color: #64748b; font-size: 0.85rem; text-decoration: none; }
    .instructor-link:hover { color: #94a3b8; }
  </style>
</head>
<body>
  <div class="container my-auto py-5">
    <div class="card p-4 mx-auto shadow-lg" style="max-width: 440px;">
      <h3 class="text-center fw-bold mb-1">AI Exams</h3>
      <p class="text-secondary text-center small mb-4">Enter your session details to begin the assessment</p>

      <div class="mb-3">
        <label for="learnerName" class="form-label small text-secondary">Your Name</label>
        <input type="text" id="learnerName" class="form-control" placeholder="e.g. Alex" required>
      </div>

      <div class="mb-4">
        <label for="sessionKey" class="form-label small text-secondary">Session Key</label>
        <input type="text" id="sessionKey" class="form-control text-uppercase tracking-widest text-center fs-5 fw-bold" placeholder="ABC-123" maxlength="7" required>
      </div>

      <button id="btnStart" class="btn btn-primary w-100 py-2" onclick="startExam()">Start Exam</button>
      <div id="errorMsg" class="text-danger small mt-2 text-center" style="display: none;"></div>

      <hr class="border-secondary my-4">
      <div class="text-center">
        <a href="instructor.html" class="instructor-link">Instructor Dashboard &rarr;</a>
      </div>
    </div>
  </div>

  <script>
    function startExam() {
      const name = document.getElementById('learnerName').value.trim();
      const key = document.getElementById('sessionKey').value.trim().toUpperCase();
      const err = document.getElementById('errorMsg');

      if (!name || !key) {
        err.innerText = "Please fill in both name and session key.";
        err.style.display = "block";
        return;
      }

      err.style.display = "none";
      // Save session info to localStorage and redirect to active exam
      localStorage.setItem('learner_name', name);
      localStorage.setItem('active_session_key', key);
      window.location.href = 'exam.html';
    }
  </script>
</body>
</html>
