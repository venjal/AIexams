<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI and Copilot Quiz</title>
  <script>
    (() => {
      const param = new URLSearchParams(window.location.search).get("scoutTheme");
      const theme =
        param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <link rel="stylesheet" href="quiz-theme.css">
  <script src="data/existing-courses.js" defer></script>
  <script src="data/copilot-courses.js" defer></script>
  <script src="quiz-core.js" defer></script>
  <script src="learner.js" defer></script>
</head>
<body>
  <main class="wrap login">
    <section class="card">
      <h1>AI and Copilot Quiz</h1>
      <p class="muted">Business and technical practice, powered entirely by GitHub Pages.</p>
      <form id="joinForm">
        <label class="field-label" for="learnerName">Your name</label>
        <input type="text" id="learnerName" autocomplete="name" maxlength="100" placeholder="e.g. Alex" required>
        <label class="field-label" for="sessionKey">Enter session key</label>
        <div class="row">
          <input type="text" id="sessionKey" placeholder="ABC-123" maxlength="7" autocomplete="off" autocapitalize="characters" required>
          <button id="btnStart" type="submit">Join</button>
        </div>
        <p id="errorMsg" class="error" role="alert" hidden></p>
      </form>
      <p class="notice">Session keys work only in the browser/profile where the instructor created
        the session. This static site does not synchronize keys or results between devices.</p>
      <noscript><p class="error">Enable JavaScript to use the quiz.</p></noscript>
      <div class="footer"><a href="instructor.html">Instructor Login</a></div>
    </section>
  </main>
</body>
</html>
