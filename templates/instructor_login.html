<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Instructor Login</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8fafc;
      font-family: Segoe UI, Arial, sans-serif;
    }
    .card {
      width: min(420px, 92vw);
      background: #fff;
      border: 1px solid #dbe3ee;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 8px 20px rgba(2, 6, 23, 0.08);
    }
    h1 { margin: 0 0 14px; font-size: 1.5rem; }
    label { display: block; margin-bottom: 8px; font-weight: 600; }
    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 1rem;
    }
    button {
      margin-top: 14px;
      width: 100%;
      border: none;
      border-radius: 8px;
      padding: 10px;
      background: #2563eb;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }
    .error { margin-top: 10px; color: #b91c1c; font-weight: 600; }
    .back { margin-top: 12px; text-align: center; }
    .back a { color: #2563eb; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Instructor Login</h1>
    <form method="post" action="/instructor/login">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required />
      <button type="submit">Sign In</button>
    </form>
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    <div class="back"><a href="/">Back to learner page</a></div>
  </div>
</body>
</html>
