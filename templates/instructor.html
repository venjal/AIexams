<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Instructor Dashboard</title>
  <style>
    body { margin: 0; font-family: Segoe UI, Arial, sans-serif; background: #f5f8fc; color: #0f172a; }
    .wrap { max-width: 980px; margin: 24px auto; padding: 0 14px; }
    .card { background: #fff; border: 1px solid #dbe3ee; border-radius: 12px; padding: 16px; margin-bottom: 14px; }
    h1 { margin: 0 0 10px; font-size: 1.6rem; }
    .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .modules { max-height: 200px; overflow: auto; border: 1px solid #dbe3ee; border-radius: 8px; padding: 10px; }
    .modules label { display: block; margin: 6px 0; }
    select, button { border-radius: 8px; padding: 9px 11px; font-size: 0.95rem; }
    select { border: 1px solid #cbd5e1; background: #fff; }
    button { border: none; background: #2563eb; color: #fff; cursor: pointer; font-weight: 700; }
    .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .btn-secondary { background: #475569; }
    .btn-danger { background: #b91c1c; }
    .session-key { font-size: 2rem; font-weight: 800; letter-spacing: 3px; color: #1d4ed8; }
    .muted { color: #64748b; }
    .status { font-size: 0.95rem; margin-top: 8px; }
    .top-actions { display: flex; justify-content: space-between; align-items: center; }
    .preview-option { border: 1px solid #cbd5e1; border-radius: 8px; padding: 9px 12px; background: #fff; }
    .preview-option.correct-ans { border-color: #16a34a; background: #dcfce7; font-weight: 700; color: #15803d; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="top-actions">
        <h1>Instructor Dashboard</h1>
        <form method="post" action="/instructor/logout">
          <button class="btn-secondary" type="submit">Logout</button>
        </form>
      </div>
      <div class="muted">Create a session, share key with learners, then push questions live.</div>
    </div>

    <div class="card">
      <div class="controls">
        <div>
          <h3>Modules</h3>
          <div style="margin-bottom:6px; display:flex; gap:8px;">
            <button type="button" onclick="setAllModules(true)" style="font-size:0.8rem; padding:4px 10px; background:#e2e8f0; color:#0f172a; border:1px solid #cbd5e1; border-radius:6px; cursor:pointer; font-weight:600;">Select All</button>
            <button type="button" onclick="setAllModules(false)" style="font-size:0.8rem; padding:4px 10px; background:#e2e8f0; color:#0f172a; border:1px solid #cbd5e1; border-radius:6px; cursor:pointer; font-weight:600;">Deselect All</button>
          </div>
          <div class="modules" id="moduleList"></div>
        </div>
        <div>
          <h3>Settings</h3>
          <label>Mode</label>
          <select id="mode">
            <option value="quiz">Quiz</option>
            <option value="quiz-modules">Quiz by Module</option>
            <option value="flashcards">Flashcards</option>
          </select>
          <label style="display:block; margin-top:10px;">Question count</label>
          <select id="questionCount">
            <option value="5">5</option>
            <option value="10">10</option>
            <option value="15">15</option>
            <option value="20">20</option>
          </select>
          <label style="display:block; margin-top:10px;">Timer (seconds)</label>
          <select id="timerSeconds">
            <option value="30">30</option>
            <option value="45">45</option>
            <option value="60" selected>60</option>
            <option value="90">90</option>
            <option value="120">120</option>
          </select>
          <div class="btn-row">
            <button id="startBtn" type="button">Start New Session</button>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <div>Session key</div>
      <div id="sessionKey" class="session-key">-</div>
      <div id="learnerCount" class="status">Learners: 0</div>
      <div id="statsBar" class="status muted">Answered: 0 / 0  |  Correct: 0  Incorrect: 0</div>
      <div id="progressBar" style="margin-top:8px; background:#e2e8f0; border-radius:8px; overflow:hidden; height:8px;">
        <div id="progressFill" style="width:0%; background:#3b82f6; height:100%; transition:width 0.3s;"></div>
      </div>
      <div id="liveStatus" class="status muted">No active session</div>

      <div class="btn-row">
        <button id="pushBtn" type="button">Push Question</button>
        <button id="revealBtn" class="btn-secondary" type="button">Reveal Answer</button>
        <button id="nextBtn" class="btn-secondary" type="button">Next Question</button>
        <button id="endBtn" class="btn-danger" type="button">End Session</button>
      </div>
    </div>

    <div class="card" id="questionPreviewCard" style="display:none;">
      <div style="font-size:0.8rem; font-weight:700; color:#64748b; text-transform:uppercase; letter-spacing:1px;">Current Question (Instructor View)</div>
      <div id="previewQuestion" style="margin-top:8px; font-size:1.1rem; font-weight:700;"></div>
      <div id="previewOptions" style="margin-top:10px; display:grid; gap:6px;"></div>
      <div id="previewExplanation" style="margin-top:10px; padding:10px; border:1px solid #dbe3ee; border-radius:8px; background:#f8fafc; display:none;"></div>
    </div>
  </div>

  <script>
    const modules = {{ modules | tojson }};
    const moduleList = document.getElementById('moduleList');
    const startBtn = document.getElementById('startBtn');
    const pushBtn = document.getElementById('pushBtn');
    const revealBtn = document.getElementById('revealBtn');
    const nextBtn = document.getElementById('nextBtn');
    const endBtn = document.getElementById('endBtn');
    const sessionKeyEl = document.getElementById('sessionKey');
    const learnerCountEl = document.getElementById('learnerCount');
    const liveStatusEl = document.getElementById('liveStatus');

    let currentKey = '';
    let currentPushedQuestion = null;
    let previewRevealed = false;

    function renderModules() {
      moduleList.innerHTML = '';
      modules.forEach((m, idx) => {
        const id = `mod-${idx + 1}`;
        const row = document.createElement('label');
        row.innerHTML = `<input type="checkbox" value="${idx + 1}" id="${id}"> ${m.title}`;
        moduleList.appendChild(row);
      });
    }

    function setAllModules(checked) {
      moduleList.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = checked);
    }

    function selectedModuleIds() {
      return Array.from(moduleList.querySelectorAll('input[type="checkbox"]:checked')).map(x => Number(x.value));
    }

    async function startSession() {
      const selectedMods = selectedModuleIds();
      if (!selectedMods.length) {
        alert('Select at least one module before starting a session.');
        return;
      }
      const payload = {
        mode: document.getElementById('mode').value,
        modules: selectedMods,
        question_count: Number(document.getElementById('questionCount').value),
        timer_seconds: Number(document.getElementById('timerSeconds').value),
      };
      const res = await fetch('/api/session/start', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload),
      });
      const data = await res.json();
      if (!res.ok) {
        alert(data.error || 'Could not start session');
        return;
      }
      currentKey = data.key;
      sessionKeyEl.textContent = currentKey;
      liveStatusEl.textContent = 'Session active';
      await pollStatus();
    }

    async function pushQuestion() {
      if (!currentKey) {
        alert('Start a session first');
        return;
      }
      const modules = selectedModuleIds();
      const moduleId = modules.length ? modules[0] : 1;
      const qRes = await fetch(`/api/quiz/questions/module?module_id=${moduleId}&count=1&fresh=true`);
      const qData = await qRes.json();
      if (!qRes.ok || !qData.questions || !qData.questions.length) {
        alert('Could not generate a question');
        return;
      }
      const pRes = await fetch('/api/session/push-question', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({key: currentKey, question: qData.questions[0]}),
      });
      const pData = await pRes.json();
      if (!pRes.ok) {
        alert(pData.error || 'Could not push question');
        return;
      }
      liveStatusEl.textContent = 'Question pushed';
      currentPushedQuestion = qData.questions[0];
      previewRevealed = false;
      renderQuestionPreview(currentPushedQuestion);
    }

    function renderQuestionPreview(question) {
      const card = document.getElementById('questionPreviewCard');
      const qEl = document.getElementById('previewQuestion');
      const optsEl = document.getElementById('previewOptions');
      const expEl = document.getElementById('previewExplanation');
      card.style.display = 'block';
      qEl.textContent = question.question || '';
      optsEl.innerHTML = '';
      const correctIdx = Number(question.answer);
      (question.options || []).forEach((opt, idx) => {
        const div = document.createElement('div');
        const isCorrect = previewRevealed && idx === correctIdx;
        div.className = 'preview-option' + (isCorrect ? ' correct-ans' : '');
        div.textContent = (isCorrect ? '\u2713 ' : '') + opt;
        optsEl.appendChild(div);
      });
      expEl.textContent = previewRevealed ? (question.explanation || '') : '(Explanation hidden until revealed)';
      expEl.style.display = 'block';
      expEl.style.color = previewRevealed ? '' : '#94a3b8';
    }

    async function revealAnswer() {
      if (!currentKey) return;
      await fetch('/api/session/reveal', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({key: currentKey}),
      });
      liveStatusEl.textContent = 'Answer revealed';
      // Now show the correct answer in the instructor preview
      if (currentPushedQuestion) {
        previewRevealed = true;
        renderQuestionPreview(currentPushedQuestion);
      }
    }

    async function nextQuestion() {
      if (!currentKey) return;
      await fetch('/api/session/next', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({key: currentKey}),
      });
      liveStatusEl.textContent = 'Waiting for next push';
      document.getElementById('questionPreviewCard').style.display = 'none';
    }

    async function endSession() {
      if (!currentKey) return;
      await fetch('/api/session/end', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({key: currentKey}),
      });
      liveStatusEl.textContent = 'Session ended';
      currentKey = '';
      sessionKeyEl.textContent = '-';
      learnerCountEl.textContent = 'Learners: 0';
      document.getElementById('questionPreviewCard').style.display = 'none';
    }

    async function pollStatus() {
      if (!currentKey) {
        return;
      }
      const res = await fetch(`/api/session/status?key=${encodeURIComponent(currentKey)}`);
      const data = await res.json();
      if (res.ok) {
        learnerCountEl.textContent = `Learners: ${data.learner_count}`;
        const statsBar = document.getElementById('statsBar');
        const progressFill = document.getElementById('progressFill');
        statsBar.textContent = `Answered: ${data.answered_count} / ${data.learner_count}  |  Correct: ${data.correct}  Incorrect: ${data.incorrect}`;
        const pct = data.learner_count > 0 ? (data.answered_count / data.learner_count) * 100 : 0;
        progressFill.style.width = `${pct}%`;
      }
    }

    setInterval(pollStatus, 3000);
    startBtn.addEventListener('click', startSession);
    pushBtn.addEventListener('click', pushQuestion);
    revealBtn.addEventListener('click', revealAnswer);
    nextBtn.addEventListener('click', nextQuestion);
    endBtn.addEventListener('click', endSession);
    renderModules();
  </script>
</body>
</html>
