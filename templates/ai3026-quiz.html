<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI3026 Quiz</title>
  <style>
    body { margin: 0; font-family: Segoe UI, Arial, sans-serif; background: linear-gradient(135deg,#e9f2ff,#f7f9fc); color:#0f172a; }
    .container { max-width: 840px; margin: 36px auto; background:#fff; border:1px solid #dbe3ee; border-radius:16px; box-shadow:0 10px 24px rgba(2,6,23,.1); padding:24px; }
    .title-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
    .title-row h1 { margin:0; flex:1; text-align:center; }
    .title-spacer { width:38px; height:38px; }
    .info-btn { width:38px; height:38px; border-radius:999px; border:1px solid #cbd5e1; background:#fff; font-weight:700; cursor:pointer; }
    .topbar { display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
    .pill { background:#f1f5f9; border-radius:10px; padding:10px 12px; font-weight:700; }
    .question-card { border:1px solid #dbe3ee; border-radius:12px; background:#fbfdff; padding:18px; }
    .question { font-size:1.08rem; font-weight:700; margin-bottom:12px; }
    .options button { width:100%; text-align:left; margin:7px 0; padding:11px 12px; border:1px solid #cbd5e1; border-radius:10px; background:#fff; cursor:pointer; }
    .options button:disabled { opacity:.96; cursor:not-allowed; }
    .correct { background:#dcfce7 !important; border-color:#16a34a !important; }
    .wrong { background:#fee2e2 !important; border-color:#dc2626 !important; }
    .feedback { margin-top:10px; font-weight:700; }
    .nav { display:flex; justify-content:space-between; margin-top:14px; gap:10px; }
    .nav button, .restart { border:none; border-radius:10px; padding:10px 14px; font-weight:700; cursor:pointer; color:#fff; background:#2563eb; }
    .nav button:disabled { background:#94a3b8; cursor:not-allowed; }
    .hidden { display:none; }
    .result { text-align:center; padding:22px; }
    .info-modal { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(15,23,42,.45); }
    .info-modal.open { display:flex; }
    .info-card { width:min(360px,92vw); background:#fff; border:1px solid #dbe3ee; border-radius:12px; padding:14px; position:relative; }
    .info-close { position:absolute; top:10px; right:10px; border:none; background:transparent; cursor:pointer; }
  </style>
</head>
<body>
  <div class="container">
    <div class="title-row">
      <div class="title-spacer"></div>
      <h1>AI3026 Objective Quiz</h1>
      <button class="info-btn" id="infoBtn" type="button" aria-label="Quiz information">i</button>
    </div>

    <div class="topbar">
      <div class="pill">Score: <span id="score">0</span> / <span id="total">5</span></div>
      <div class="pill">Question <span id="currentNum">1</span> of <span id="total2">5</span></div>
    </div>

    <div id="quizArea">
      <div id="quiz"></div>
      <div class="nav">
        <button id="prevBtn" type="button">Previous</button>
        <button id="nextBtn" type="button">Next</button>
      </div>
    </div>

    <div id="resultArea" class="result hidden">
      <h2>Quiz Completed</h2>
      <p id="finalScore"></p>
      <button class="restart" id="restartBtn" type="button">Restart Quiz</button>
    </div>
  </div>

  <div class="info-modal" id="infoModal" aria-hidden="true">
    <div class="info-card" role="dialog" aria-modal="true" aria-label="Creator information">
      <button class="info-close" id="closeInfoBtn" type="button">x</button>
      <h3>Page Info</h3>
      <p><strong>Creator name:</strong> Venkat Jalasutram</p>
      <p><strong>Version:</strong> 1.0</p>
    </div>
  </div>

  <script>
    const quizContainer = document.getElementById('quiz');
    const scoreElement = document.getElementById('score');
    const currentNum = document.getElementById('currentNum');
    const totalEl = document.getElementById('total');
    const total2El = document.getElementById('total2');
    const quizArea = document.getElementById('quizArea');
    const resultArea = document.getElementById('resultArea');
    const finalScore = document.getElementById('finalScore');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    let questions = [];
    let currentQuestion = 0;
    let answers = [];

    async function loadQuestions() {
      quizContainer.innerHTML = '<div class="question-card">Loading questions...</div>';
      try {
        const res = await fetch('/api/quiz/questions?count=5&fresh=true');
        const data = await res.json();
        questions = (data.questions || []).map((q) => ({...q, answer: Number(q.answer)}));
      } catch (e) {
        questions = [];
      }

      if (!questions.length) {
        quizContainer.innerHTML = '<div class="question-card">Could not load quiz questions.</div>';
        prevBtn.disabled = true;
        nextBtn.disabled = true;
        return;
      }

      totalEl.textContent = questions.length;
      total2El.textContent = questions.length;
      currentQuestion = 0;
      answers = new Array(questions.length).fill(null);
      scoreElement.textContent = '0';
      quizArea.classList.remove('hidden');
      resultArea.classList.add('hidden');
      renderQuestion();
    }

    function renderQuestion() {
      const q = questions[currentQuestion];
      currentNum.textContent = currentQuestion + 1;
      const selected = answers[currentQuestion];

      const card = document.createElement('div');
      card.className = 'question-card';
      const qText = document.createElement('div');
      qText.className = 'question';
      qText.textContent = q.question;
      card.appendChild(qText);

      const optionsDiv = document.createElement('div');
      optionsDiv.className = 'options';
      const feedback = document.createElement('div');
      feedback.className = 'feedback';

      q.options.forEach((option, i) => {
        const btn = document.createElement('button');
        btn.textContent = option;
        if (selected !== null) {
          btn.disabled = true;
          if (i === q.answer) btn.classList.add('correct');
          if (selected === i && i !== q.answer) btn.classList.add('wrong');
        }
        btn.onclick = () => {
          if (answers[currentQuestion] !== null) return;
          answers[currentQuestion] = i;
          renderQuestion();
        };
        optionsDiv.appendChild(btn);
      });

      if (selected !== null) {
        feedback.textContent = selected === q.answer ? 'Correct!' : `Wrong! Correct answer: ${q.options[q.answer]}`;
        feedback.style.color = selected === q.answer ? '#166534' : '#991b1b';
      }

      card.appendChild(optionsDiv);
      card.appendChild(feedback);
      quizContainer.innerHTML = '';
      quizContainer.appendChild(card);

      prevBtn.disabled = currentQuestion === 0;
      nextBtn.textContent = currentQuestion === questions.length - 1 ? 'Finish' : 'Next';
      nextBtn.disabled = answers[currentQuestion] === null;
    }

    prevBtn.onclick = () => {
      if (currentQuestion > 0) {
        currentQuestion -= 1;
        renderQuestion();
      }
    };

    nextBtn.onclick = () => {
      if (answers[currentQuestion] === null) return;
      if (currentQuestion < questions.length - 1) {
        currentQuestion += 1;
        renderQuestion();
      } else {
        const score = answers.reduce((sum, selected, idx) => sum + (selected === questions[idx].answer ? 1 : 0), 0);
        scoreElement.textContent = String(score);
        finalScore.textContent = `You scored ${score} out of ${questions.length}.`;
        quizArea.classList.add('hidden');
        resultArea.classList.remove('hidden');
      }
    };

    document.getElementById('restartBtn').onclick = loadQuestions;

    const infoBtn = document.getElementById('infoBtn');
    const infoModal = document.getElementById('infoModal');
    const closeInfoBtn = document.getElementById('closeInfoBtn');
    infoBtn.onclick = () => infoModal.classList.add('open');
    closeInfoBtn.onclick = () => infoModal.classList.remove('open');
    infoModal.onclick = (e) => { if (e.target === infoModal) infoModal.classList.remove('open'); };

    loadQuestions();
  </script>
</body>
</html>
