<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI3026 Module Quiz</title>
  <style>
    :root {
      --bg: #f3f6fb;
      --card: #ffffff;
      --line: #d9e2ee;
      --ink: #1e293b;
      --muted: #64748b;
      --brand: #2563eb;
      --ok-bg: #dcfce7;
      --ok-line: #22c55e;
      --bad-bg: #fee2e2;
      --bad-line: #ef4444;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      color: var(--ink);
      background: radial-gradient(circle at 20% 10%, #e8f0ff, transparent 40%), var(--bg);
    }

    .layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      min-height: 100vh;
      gap: 16px;
      padding: 16px;
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
    }

    .panel-head {
      padding: 16px;
      border-bottom: 1px solid var(--line);
      background: #f8fbff;
    }

    .panel-head h1,
    .panel-head h2 {
      margin: 0;
      font-size: 1.05rem;
    }

    .module-list {
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: calc(100vh - 120px);
      overflow: auto;
    }

    .module-btn {
      width: 100%;
      text-align: left;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      padding: 10px;
      cursor: pointer;
      color: var(--ink);
    }

    .module-btn small {
      display: block;
      color: var(--muted);
      margin-top: 4px;
    }

    .module-btn.active {
      border-color: var(--brand);
      box-shadow: inset 0 0 0 1px var(--brand);
      background: #eff6ff;
    }

    .content {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .topbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      background: #f8fbff;
    }

    .pill {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 0.9rem;
      color: var(--muted);
      background: #fff;
    }

    .actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .actions select {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      padding: 8px 10px;
      font-weight: 600;
    }

    .actions button {
      border: none;
      border-radius: 8px;
      background: var(--brand);
      color: #fff;
      padding: 9px 12px;
      cursor: pointer;
      font-weight: 600;
    }

    .actions button:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    .info-btn {
      width: 36px;
      height: 36px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      cursor: pointer;
      font-size: 1rem;
      font-weight: 700;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .info-btn:hover {
      background: #eff6ff;
      border-color: var(--brand);
    }

    .quiz-body {
      padding: 16px;
    }

    .question-card {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      padding: 16px;
    }

    .question {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .options {
      display: grid;
      gap: 8px;
    }

    .option {
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      background: #fff;
      padding: 11px 12px;
      text-align: left;
      cursor: pointer;
      width: 100%;
      color: var(--ink);
    }

    .option:disabled {
      cursor: not-allowed;
      opacity: 0.95;
    }

    .option.correct {
      background: var(--ok-bg);
      border-color: var(--ok-line);
      color: #14532d;
    }

    .option.wrong {
      background: var(--bad-bg);
      border-color: var(--bad-line);
      color: #7f1d1d;
    }

    .feedback {
      margin-top: 12px;
      font-weight: 700;
    }

    .answer-panel {
      margin-top: 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px;
      background: #f8fbff;
      display: none;
    }

    .answer-panel h3 {
      margin: 0 0 10px;
      font-size: 0.98rem;
    }

    .reason {
      margin: 0 0 8px;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #dbe7f5;
      background: #fff;
      font-size: 0.93rem;
      line-height: 1.45;
    }

    .reason.correct {
      border-color: var(--ok-line);
      background: #f0fdf4;
    }

    .nav {
      margin-top: 12px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .nav button {
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      font-weight: 600;
      cursor: pointer;
      color: #fff;
      background: var(--brand);
    }

    .nav button:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    .status {
      padding: 14px;
      color: var(--muted);
      border: 1px dashed #cdd8e5;
      border-radius: 10px;
      background: #fff;
    }

    .info-modal {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(15, 23, 42, 0.45);
      z-index: 1000;
      padding: 20px;
    }

    .info-modal.open {
      display: flex;
    }

    .info-card {
      width: 100%;
      max-width: 360px;
      background: #fff;
      border-radius: 14px;
      border: 1px solid var(--line);
      padding: 16px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.2);
      position: relative;
    }

    .info-card h3 {
      margin: 0 0 10px;
      font-size: 1.05rem;
    }

    .info-card p {
      margin: 8px 0;
      color: #334155;
      font-size: 0.96rem;
    }

    .info-close {
      position: absolute;
      right: 10px;
      top: 10px;
      border: none;
      background: transparent;
      color: #475569;
      cursor: pointer;
      font-size: 1.1rem;
      line-height: 1;
    }

    .footer-note {
      position: fixed;
      right: 12px;
      bottom: 8px;
      font-size: 0.72rem;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.85);
      border-radius: 999px;
      padding: 2px 8px;
      backdrop-filter: blur(2px);
      z-index: 900;
    }

    @media (max-width: 960px) {
      .layout { grid-template-columns: 1fr; }
      .module-list { max-height: 280px; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="panel">
      <div class="panel-head">
        <h1>AI3026 Modules</h1>
      </div>
      <div class="module-list" id="moduleList"></div>
    </aside>

    <main class="panel content">
      <div class="topbar">
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <span class="pill" id="activeModule">No module selected</span>
          <span class="pill" id="progress">Question 0 of 0</span>
          <span class="pill" id="score">Score 0</span>
        </div>
        <div class="actions">
          <select id="questionCount" title="Number of questions">
            <option value="5">5 questions</option>
            <option value="10" selected>10 questions</option>
            <option value="15">15 questions</option>
            <option value="20">20 questions</option>
            <option value="25">25 questions</option>
          </select>
          <button id="regenBtn" disabled>Regenerate</button>
          <button id="saveBtn" disabled>Save to File</button>
          <button class="info-btn" id="infoBtn" type="button" aria-label="Module quiz information">&#8505;&#65039;</button>
        </div>
      </div>

      <div class="quiz-body" id="quizBody">
        <div class="status">Select a module to generate quiz questions with detailed explanations.</div>
      </div>
    </main>
  </div>

  <div class="info-modal" id="infoModal" aria-hidden="true">
    <div class="info-card" role="dialog" aria-modal="true" aria-label="Creator information">
      <button class="info-close" id="closeInfoBtn" type="button" aria-label="Close information">x</button>
      <h3>Page Info</h3>
      <p><strong>Creator name:</strong> Venkat Jalasutram</p>
      <p><strong>Version:</strong> 1.0</p>
    </div>
  </div>

  <div class="footer-note">Created by venkat jalasutram</div>

  <script>
    const moduleListEl = document.getElementById("moduleList");
    const quizBodyEl = document.getElementById("quizBody");
    const activeModuleEl = document.getElementById("activeModule");
    const progressEl = document.getElementById("progress");
    const scoreEl = document.getElementById("score");
    const questionCountEl = document.getElementById("questionCount");
    const regenBtn = document.getElementById("regenBtn");
    const saveBtn = document.getElementById("saveBtn");
    const infoBtn = document.getElementById("infoBtn");
    const infoModal = document.getElementById("infoModal");
    const closeInfoBtn = document.getElementById("closeInfoBtn");

    let modules = [];
    let selectedModuleId = null;
    let questions = [];
    let answers = [];
    let currentIndex = 0;
    let lastSource = "";

    function getApiBaseUrl() {
      if (window.location.protocol === "file:") {
        return "http://127.0.0.1:8000";
      }
      return "";
    }

    function getQuestionCount() {
      const parsed = Number(questionCountEl.value);
      if (!Number.isFinite(parsed)) return 10;
      return Math.max(1, Math.min(25, Math.trunc(parsed)));
    }

    async function loadModules() {
      try {
        const res = await fetch(`${getApiBaseUrl()}/api/quiz/modules`);
        const data = await res.json();
        modules = data.modules || [];
      } catch (error) {
        modules = [];
      }
      renderModules();
    }

    function renderModules() {
      moduleListEl.innerHTML = "";
      if (!modules.length) {
        moduleListEl.innerHTML = '<div class="status">Could not load module list.</div>';
        return;
      }

      modules.forEach((module) => {
        const btn = document.createElement("button");
        btn.className = "module-btn" + (module.id === selectedModuleId ? " active" : "");
        btn.innerHTML = `<strong>Module ${module.id}</strong><small>${module.title}</small>`;
        btn.onclick = () => selectModule(module.id);
        moduleListEl.appendChild(btn);
      });
    }

    function updateTopbar() {
      const active = modules.find((m) => m.id === selectedModuleId);
      activeModuleEl.textContent = active ? `Module ${active.id}: ${active.title}` : "No module selected";
      progressEl.textContent = `Question ${questions.length ? currentIndex + 1 : 0} of ${questions.length}`;
      const score = answers.reduce((sum, chosen, idx) => sum + (chosen === questions[idx]?.answer ? 1 : 0), 0);
      scoreEl.textContent = `Score ${score}`;
      regenBtn.disabled = !selectedModuleId;
      saveBtn.disabled = !selectedModuleId || !questions.length;
    }

    async function selectModule(moduleId) {
      selectedModuleId = moduleId;
      renderModules();
      await generateModuleQuestions(true);
    }

    async function generateModuleQuestions(fresh) {
      if (!selectedModuleId) return;

      quizBodyEl.innerHTML = '<div class="status">Generating module questions...</div>';
      updateTopbar();

      try {
        const url = `${getApiBaseUrl()}/api/quiz/questions/module?module_id=${selectedModuleId}&count=${getQuestionCount()}&fresh=${fresh ? "true" : "false"}`;
        const res = await fetch(url);
        if (!res.ok) {
          throw new Error(`Request failed: ${res.status}`);
        }
        const data = await res.json();
        lastSource = data.source || "";
        questions = (data.questions || []).map((q) => ({
          ...q,
          answer: Number(q.answer),
        }));
        answers = new Array(questions.length).fill(null);
        currentIndex = 0;

        if (!questions.length) {
          quizBodyEl.innerHTML = '<div class="status">No questions returned for this module.</div>';
          updateTopbar();
          return;
        }

        renderQuestion();
      } catch (error) {
        lastSource = "";
        quizBodyEl.innerHTML = '<div class="status">Could not generate module quiz. Make sure backend is running and try again.</div>';
      }

      updateTopbar();
    }

    function renderQuestion() {
      const q = questions[currentIndex];
      if (!q) {
        quizBodyEl.innerHTML = '<div class="status">No question to display.</div>';
        return;
      }

      const selected = answers[currentIndex];
      const card = document.createElement("div");
      card.className = "question-card";

      const qText = document.createElement("div");
      qText.className = "question";
      qText.textContent = q.question;
      card.appendChild(qText);

      const options = document.createElement("div");
      options.className = "options";

      const feedback = document.createElement("div");
      feedback.className = "feedback";

      q.options.forEach((opt, idx) => {
        const btn = document.createElement("button");
        btn.className = "option";
        btn.textContent = opt;

        if (selected !== null) {
          btn.disabled = true;
          if (idx === q.answer) btn.classList.add("correct");
          if (idx === selected && idx !== q.answer) btn.classList.add("wrong");
        }

        btn.onclick = () => {
          if (answers[currentIndex] !== null) return;
          answers[currentIndex] = idx;
          renderQuestion();
          updateTopbar();
        };

        options.appendChild(btn);
      });

      card.appendChild(options);

      const answerPanel = document.createElement("div");
      answerPanel.className = "answer-panel";

      if (selected !== null) {
        if (selected === q.answer) {
          feedback.style.color = "#166534";
          feedback.textContent = "Correct.";
        } else {
          feedback.style.color = "#991b1b";
          feedback.textContent = `Incorrect. Correct answer: ${q.options[q.answer]}`;
        }

        answerPanel.style.display = "block";
        const heading = document.createElement("h3");
        heading.textContent = "Detailed option analysis";
        answerPanel.appendChild(heading);

        q.options.forEach((opt, idx) => {
          const reason = document.createElement("div");
          reason.className = "reason" + (idx === q.answer ? " correct" : "");
          const status = idx === q.answer ? "Correct" : "Incorrect";
          const detail = Array.isArray(q.option_explanations) ? (q.option_explanations[idx] || "") : "";
          reason.innerHTML = `<strong>${status}:</strong> ${opt}<br>${detail}`;
          answerPanel.appendChild(reason);
        });
      }

      card.appendChild(feedback);
      card.appendChild(answerPanel);

      const nav = document.createElement("div");
      nav.className = "nav";

      const prev = document.createElement("button");
      prev.textContent = "Previous";
      prev.disabled = currentIndex === 0;
      prev.onclick = () => {
        if (currentIndex > 0) {
          currentIndex -= 1;
          renderQuestion();
          updateTopbar();
        }
      };

      const next = document.createElement("button");
      next.textContent = currentIndex === questions.length - 1 ? "Finish" : "Next";
      next.disabled = answers[currentIndex] === null;
      next.onclick = () => {
        if (answers[currentIndex] === null) return;
        if (currentIndex < questions.length - 1) {
          currentIndex += 1;
          renderQuestion();
        } else {
          showResult();
        }
        updateTopbar();
      };

      nav.appendChild(prev);
      nav.appendChild(next);
      card.appendChild(nav);

      quizBodyEl.innerHTML = "";
      quizBodyEl.appendChild(card);
    }

    function showResult() {
      const score = answers.reduce((sum, chosen, idx) => sum + (chosen === questions[idx]?.answer ? 1 : 0), 0);
      quizBodyEl.innerHTML = `
        <div class="question-card">
          <div class="question">Module Quiz Completed</div>
          <p>You scored <strong>${score}</strong> out of <strong>${questions.length}</strong>.</p>
          <div class="actions" style="margin-top: 10px;">
            <button onclick="restartModuleQuiz()">Retry Same Module</button>
          </div>
        </div>
      `;
    }

    function restartModuleQuiz() {
      if (!questions.length) return;
      answers = new Array(questions.length).fill(null);
      currentIndex = 0;
      renderQuestion();
      updateTopbar();
    }

    regenBtn.onclick = () => generateModuleQuestions(true);

    questionCountEl.onchange = () => {
      if (selectedModuleId) {
        generateModuleQuestions(true);
      }
    };

    saveBtn.onclick = async () => {
      if (!selectedModuleId || !questions.length) return;
      const module = modules.find((m) => m.id === selectedModuleId);
      try {
        saveBtn.disabled = true;
        const res = await fetch(`${getApiBaseUrl()}/api/quiz/save`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            module_title: module ? module.title : "Unknown Module",
            source: lastSource || "unknown",
            questions,
            answers,
          }),
        });
        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.detail || "Save failed");
        }
        alert(`Saved to file:\n${data.file}`);
      } catch (error) {
        alert(`Could not save quiz: ${error.message || error}`);
      } finally {
        updateTopbar();
      }
    };

    window.restartModuleQuiz = restartModuleQuiz;

    infoBtn.addEventListener("click", () => {
      infoModal.classList.add("open");
      infoModal.setAttribute("aria-hidden", "false");
    });

    function closeInfoModal() {
      infoModal.classList.remove("open");
      infoModal.setAttribute("aria-hidden", "true");
    }

    closeInfoBtn.addEventListener("click", closeInfoModal);
    infoModal.addEventListener("click", (event) => {
      if (event.target === infoModal) {
        closeInfoModal();
      }
    });

    window.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && infoModal.classList.contains("open")) {
        closeInfoModal();
      }
    });

    loadModules();
  </script>
</body>
</html>
