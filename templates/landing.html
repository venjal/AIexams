<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Quiz</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Segoe UI, Arial, sans-serif;
      background: linear-gradient(135deg, #edf4ff, #f7fbff);
      color: #0f172a;
    }
    .card {
      width: min(480px, 92vw);
      background: #fff;
      border: 1px solid #dbe5f1;
      border-radius: 14px;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.1);
      padding: 28px;
    }
    h1 {
      margin: 0 0 18px;
      text-align: center;
      font-size: 1.9rem;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .row {
      display: flex;
      gap: 10px;
    }
    input {
      flex: 1;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 11px 12px;
      font-size: 1rem;
      text-transform: uppercase;
    }
    button {
      border: none;
      background: #2563eb;
      color: #fff;
      padding: 11px 16px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
    }
    .error {
      margin-top: 12px;
      color: #b91c1c;
      font-weight: 600;
    }
    .footer {
      margin-top: 18px;
      text-align: center;
      font-size: 0.95rem;
    }
    .footer a {
      color: #2563eb;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>AI Quiz</h1>
    <form method="post" action="/join">
      <label for="key">Enter session key</label>
      <div class="row">
        <input id="key" name="key" maxlength="6" autocomplete="off" required />
        <button type="submit">Join</button>
      </div>
      {% if error %}
      <div class="error">{{ error }}</div>
      {% endif %}
    </form>
    <div class="footer">
      <a href="/instructor">Instructor Login</a>
    </div>
  </div>
</body>
</html>
