<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agent Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --paper: #f4efe6;
      --ink: #23201b;
      --muted: #8a8170;
      --user-bubble: #2f2a22;
      --user-ink: #f4efe6;
      --agent-bubble: #fffdf8;
      --line: #ddd4c4;
      --accent: #b4561f;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: "Newsreader", Georgia, serif;
      font-size: 18px;
      display: flex;
      justify-content: center;
    }
    .app {
      width: 100%;
      max-width: 720px;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      border-left: 1px solid var(--line);
      border-right: 1px solid var(--line);
      background:
        radial-gradient(circle at 1px 1px, rgba(0,0,0,0.025) 1px, transparent 0) 0 0 / 22px 22px,
        var(--paper);
    }
    header {
      padding: 22px 28px 18px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
    }
    header h1 {
      font-family: "Fraunces", serif;
      font-weight: 600;
      font-size: 26px;
      margin: 0;
      letter-spacing: -0.01em;
    }
    header .sub {
      color: var(--muted);
      font-size: 14px;
      font-style: italic;
    }
    button.reset {
      font-family: "Newsreader", serif;
      font-size: 14px;
      background: transparent;
      border: 1px solid var(--line);
      color: var(--muted);
      padding: 6px 14px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    button.reset:hover { border-color: var(--accent); color: var(--accent); }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 26px 28px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .row { display: flex; }
    .row.user { justify-content: flex-end; }
    .bubble {
      max-width: 78%;
      padding: 13px 17px;
      border-radius: 16px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
      animation: rise 0.25s ease both;
    }
    .user .bubble {
      background: var(--user-bubble);
      color: var(--user-ink);
      border-bottom-right-radius: 5px;
    }
    .agent .bubble {
      background: var(--agent-bubble);
      border: 1px solid var(--line);
      border-bottom-left-radius: 5px;
    }
    .label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 5px;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .typing .bubble { color: var(--muted); font-style: italic; }

    form {
      border-top: 1px solid var(--line);
      padding: 16px 20px;
      display: flex;
      gap: 12px;
      align-items: flex-end;
    }
    textarea {
      flex: 1;
      resize: none;
      font-family: "Newsreader", serif;
      font-size: 18px;
      line-height: 1.4;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fffdf8;
      color: var(--ink);
      max-height: 160px;
    }
    textarea:focus { outline: none; border-color: var(--accent); }
    button.send {
      font-family: "Fraunces", serif;
      font-weight: 600;
      font-size: 16px;
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 12px 22px;
      border-radius: 12px;
      cursor: pointer;
      transition: opacity 0.15s ease;
    }
    button.send:disabled { opacity: 0.45; cursor: default; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1>Agent Chat</h1>
        <div class="sub">talking to your Foundry agent</div>
      </div>
      <button class="reset" id="reset">New chat</button>
    </header>

    <div class="messages" id="messages"></div>

    <form id="form">
      <textarea id="input" rows="1" placeholder="Type a message&hellip;" autofocus></textarea>
      <button class="send" id="send" type="submit">Send</button>
    </form>
  </div>

  <script>
    // Grab the page elements we need to work with.
    const messagesEl = document.getElementById("messages");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const resetBtn = document.getElementById("reset");

    // Add a message bubble to the page. who = "user" or "agent".
    function addMessage(who, text) {
      const row = document.createElement("div");
      row.className = "row " + who;
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      const label = document.createElement("div");
      label.className = "label";
      label.textContent = who === "user" ? "You" : "Agent";
      bubble.appendChild(label);
      bubble.appendChild(document.createTextNode(text));
      row.appendChild(bubble);
      messagesEl.appendChild(row);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return row;
    }

    // Let the textarea grow as you type, and send on Enter (Shift+Enter = new line).
    input.addEventListener("input", () => {
      input.style.height = "auto";
      input.style.height = input.scrollHeight + "px";
    });
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        form.requestSubmit();
      }
    });

    // When you submit the form, send the message to our backend and show the reply.
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      addMessage("user", text);
      input.value = "";
      input.style.height = "auto";
      sendBtn.disabled = true;

      // Show a temporary "thinking" bubble while we wait.
      const thinking = addMessage("agent", "thinking\u2026");
      thinking.classList.add("typing");

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text }),
        });
        const data = await res.json();
        thinking.remove();
        if (!res.ok) {
          addMessage("agent", `[Request failed: ${data.detail || res.status}]`);
        } else {
          addMessage("agent", data.reply || "[No reply returned]");
        }
      } catch (err) {
        thinking.remove();
        addMessage("agent", "[Could not reach the server. Is it running?]");
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    });

    // "New chat" clears the screen and tells the backend to forget context.
    resetBtn.addEventListener("click", async () => {
      await fetch("/reset", { method: "POST" });
      messagesEl.innerHTML = "";
      input.focus();
    });
  </script>
</body>
</html>
