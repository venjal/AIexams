<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Exam Session</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #0b1120; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; min-height: 100vh; padding-bottom: 60px; }
    .card { background-color: #1e293b; border: 1px solid #334155; color: #f8fafc; border-radius: 12px; }
    .timer-badge { font-family: monospace; font-size: 1.3rem; font-weight: 700; color: #38bdf8; background: #0b1120; border: 1px solid #38bdf8; padding: 6px 14px; border-radius: 8px; }
    
    .option-card { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 14px 18px; margin-bottom: 12px; cursor: pointer; transition: all 0.15s ease-in-out; font-size: 1rem; }
    .option-card:hover:not(.locked) { border-color: #38bdf8; background: #1e293b; }
    
    .option-card.correct { border-color: #22c55e !important; background-color: rgba(34, 197, 94, 0.2) !important; color: #86efac !important; font-weight: 600; }
    .option-card.wrong { border-color: #ef4444 !important; background-color: rgba(239, 68, 68, 0.2) !important; color: #fca5a5 !important; }
    .option-card.locked { cursor: default; }

    .explanation-box { border-radius: 8px; padding: 16px; margin-top: 18px; font-size: 0.95rem; }
    .btn-primary { background-color: #2563eb; border: none; font-weight: 600; }
    .btn-primary:hover { background-color: #1d4ed8; }
    
    .q-dot { width: 34px; height: 34px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #94a3b8; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; font-size: 0.85rem; font-weight: 600; }
    .q-dot.active { border-color: #38bdf8; color: #fff; box-shadow: 0 0 8px rgba(56, 189, 248, 0.4); }
    .q-dot.dot-correct { background-color: #166534; border-color: #22c55e; color: #ffffff; }
    .q-dot.dot-wrong { background-color: #991b1b; border-color: #ef4444; color: #ffffff; }
  </style>
</head>
<body>
  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom border-secondary">
      <div>
        <h4 id="courseTitle" class="fw-bold mb-1">AI Exam</h4>
        <div class="small text-secondary">Learner: <span id="displayName" class="text-light fw-semibold"></span> | Key: <span id="displayKey" class="text-light fw-semibold"></span></div>
      </div>
      <div id="timerDisplay" class="timer-badge">00:00</div>
    </div>

    <div id="quizContainer">
      <div id="navDots" class="d-flex flex-wrap gap-2 mb-4"></div>

      <div class="card p-4 mb-4 shadow">
        <div class="d-flex justify-content-between text-secondary small mb-2">
          <span id="questionCategory">Module</span>
          <span id="questionNumber">Question 1 of 5</span>
        </div>
        <h5 id="questionPrompt" class="fw-bold mb-4">Loading question...</h5>
        <div id="optionsList"></div>
        <div id="feedbackBox" style="display: none;"></div>
      </div>

      <div class="d-flex justify-content-between align-items-center">
        <button id="btnPrev" class="btn btn-secondary px-4" onclick="changeQuestion(-1)" disabled>Previous</button>
        <button id="btnNext" class="btn btn-primary px-4" onclick="changeQuestion(1)">Next</button>
        <button id="btnSubmit" class="btn btn-success px-4" onclick="submitExam()" style="display: none;">Submit Exam</button>
      </div>
    </div>

    <div id="resultContainer" class="card p-5 text-center mx-auto mt-4 shadow-lg" style="max-width: 520px; display: none;">
      <h3 class="fw-bold mb-2">Exam Completed!</h3>
      <p class="text-secondary mb-4">Here is your final assessment summary:</p>
      <div class="display-3 fw-bold text-info mb-2" id="finalScoreDisplay">-- / --</div>
      <div class="fs-4 fw-semibold mb-4" id="percentageDisplay">--%</div>
      <a href="index.html" class="btn btn-primary w-100 py-2">Return to Lobby</a>
    </div>
  </div>

  <script>
    const sampleQuestions = [
      {
        module: "Develop AI agents with Microsoft Foundry and Visual Studio Code",
        text: "Which file in a Microsoft Foundry project contains the primary declarative metadata and configurations defining an agent's capabilities?",
        options: ["foundry.json", "agent.yaml", "config.xml", "settings.env"],
        correct: 1,
        explanation: "agent.yaml is the core specification file used by Microsoft Foundry to declare tool bindings, model deployments, and system prompts."
      },
      {
        module: "Integrate custom tools into your agent",
        text: "When registering a custom OpenAPI tool schema with an Azure AI agent, what parameter defines the HTTP payload structure expected by the backend function?",
        options: ["requestBody schema", "headerAuth mapping", "responseTarget type", "webhookListener path"],
        correct: 0,
        explanation: "The requestBody schema within the OpenAPI spec determines the JSON structure that the LLM formulates when issuing tool calls."
      },
      {
        module: "Integrate MCP Tools with Azure AI Agents",
        text: "What protocol role does an Azure AI Agent adopt when issuing dynamic tool execution requests to an MCP-compliant endpoint?",
        options: ["MCP Host / Client", "MCP Proxy Server", "MCP Resource Broker", "MCP Router"],
        correct: 0,
        explanation: "Under the Model Context Protocol (MCP) standard, the agent acts as the MCP Client/Host connecting to MCP servers providing external tools."
      },
      {
        module: "Build knowledge-enhanced AI agents with Foundry IQ",
        text: "What search indexing mode provides optimal retrieval precision when grounding agents on enterprise domain documentation in Foundry IQ?",
        options: ["Hybrid search (Dense vector + BM25 keyword)", "Pure full-text lexical search", "Exact keyword filter match", "Regular expression matching"],
        correct: 0,
        explanation: "Hybrid search merges vector similarity with BM25 inverted index scoring, providing the highest domain retrieval precision for agent grounding."
      },
      {
        module: "Develop an AI agent with Microsoft Agent Framework",
        text: "In the Microsoft Agent Framework, what component is responsible for orchestrating conversation turns and state transitions across multi-agent workflows?",
        options: ["GroupChatOrchestrator", "PromptBroker", "TokenPipeline", "AgentTelemetryGateway"],
        correct: 0,
        explanation: "GroupChatOrchestrator manages conversation history propagation, speaker selection rules, and termination conditions in multi-agent collaboration."
      }
    ];

    let currentIdx = 0;
    let userAnswers = {};
    let questions = sampleQuestions;
    let timeRemaining = 600;
    let timerTimer = null;

    window.onload = function() {
      const learnerName = localStorage.getItem("learner_name") || "Learner";
      const sessionKey = localStorage.getItem("active_session_key") || "---";

      document.getElementById("displayName").innerText = learnerName;
      document.getElementById("displayKey").innerText = sessionKey;

      const rawSession = localStorage.getItem("active_session");
      if (rawSession) {
        try {
          const session = JSON.parse(rawSession);
          document.getElementById("courseTitle").innerText = session.course || "AI Exam";
          timeRemaining = (session.duration || 10) * 60;
        } catch (e) {
          console.error("Session parse error", e);
        }
      }

      renderDots();
      renderCurrentQuestion();
      startCountdown();
    };

    function startCountdown() {
      updateTimerUI();
      timerTimer = setInterval(() => {
        timeRemaining--;
        updateTimerUI();
        if (timeRemaining <= 0) {
          clearInterval(timerTimer);
          alert("Time is up! Auto-submitting exam.");
          submitExam();
        }
      }, 1000);
    }

    function updateTimerUI() {
      const m = Math.floor(timeRemaining / 60);
      const s = timeRemaining % 60;
      document.getElementById("timerDisplay").innerText = 
        `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function renderDots() {
      const dotBox = document.getElementById("navDots");
      dotBox.innerHTML = "";
      questions.forEach((_, i) => {
        const dot = document.createElement("div");
        let statusClass = "";
        if (userAnswers[i] !== undefined) {
          statusClass = (userAnswers[i] === questions[i].correct) ? "dot-correct" : "dot-wrong";
        }
        dot.className = `q-dot ${i === currentIdx ? 'active' : ''} ${statusClass}`;
        dot.innerText = i + 1;
        dot.onclick = () => { currentIdx = i; renderCurrentQuestion(); };
        dotBox.appendChild(dot);
      });
    }

    function renderCurrentQuestion() {
      const q = questions[currentIdx];
      document.getElementById("questionCategory").innerText = q.module;
      document.getElementById("questionNumber").innerText = `Question ${currentIdx + 1} of ${questions.length}`;
      document.getElementById("questionPrompt").innerText = q.text;

      const optList = document.getElementById("optionsList");
      const feedbackBox = document.getElementById("feedbackBox");
      optList.innerHTML = "";
      feedbackBox.style.display = "none";

      const answered = userAnswers[currentIdx] !== undefined;

      q.options.forEach((opt, optIndex) => {
        const div = document.createElement("div");
        div.className = "option-card";

        if (answered) {
          div.classList.add("locked");
          if (optIndex === q.correct) {
            div.classList.add("correct");
            div.innerHTML = `✓ ${String.fromCharCode(65 + optIndex)}. ${opt} <span class="badge bg-success float-end">Correct Answer</span>`;
          } else if (userAnswers[currentIdx] === optIndex) {
            div.classList.add("wrong");
            div.innerHTML = `✗ ${String.fromCharCode(65 + optIndex)}. ${opt} <span class="badge bg-danger float-end">Your Choice</span>`;
          } else {
            div.innerText = `${String.fromCharCode(65 + optIndex)}. ${opt}`;
            div.style.opacity = "0.45";
          }
        } else {
          div.innerText = `${String.fromCharCode(65 + optIndex)}. ${opt}`;
          div.onclick = () => selectOption(optIndex);
        }

        optList.appendChild(div);
      });

      if (answered && q.explanation) {
        const isRight = userAnswers[currentIdx] === q.correct;
        feedbackBox.style.display = "block";
        feedbackBox.className = `explanation-box ${isRight ? 'border border-success bg-dark text-success' : 'border border-danger bg-dark text-danger'}`;
        feedbackBox.innerHTML = `<strong>${isRight ? 'Correct!' : 'Incorrect.'}</strong> ${q.explanation}`;
      }

      document.getElementById("btnPrev").disabled = currentIdx === 0;
      if (currentIdx === questions.length - 1) {
        document.getElementById("btnNext").style.display = "none";
        document.getElementById("btnSubmit").style.display = "inline-block";
      } else {
        document.getElementById("btnNext").style.display = "inline-block";
        document.getElementById("btnSubmit").style.display = "none";
      }
      renderDots();
    }

    function selectOption(optIndex) {
      if (userAnswers[currentIdx] !== undefined) return;
      userAnswers[currentIdx] = optIndex;
      renderCurrentQuestion();
    }

    function changeQuestion(delta) {
      currentIdx += delta;
      renderCurrentQuestion();
    }

    function submitExam() {
      clearInterval(timerTimer);
      let score = 0;
      questions.forEach((q, i) => {
        if (userAnswers[i] === q.correct) score++;
      });

      document.getElementById("quizContainer").style.display = "none";
      document.getElementById("resultContainer").style.display = "block";
      document.getElementById("finalScoreDisplay").innerText = `${score} / ${questions.length}`;
      document.getElementById("percentageDisplay").innerText = `${Math.round((score / questions.length) * 100)}%`;
    }
  </script>
</body>
</html>
